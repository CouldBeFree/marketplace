apiVersion: 1

# Провайдер дашбордів: Grafana підхоплює JSON із /etc/grafana/dashboards (туди compose монтує
# observability/dashboards/).
providers:
  - name: marketplace
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
