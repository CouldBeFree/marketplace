apiVersion: 1

# Датасорси провіжняться КОНФІГОМ (не руками). У all-in-one grafana/otel-lgtm Prometheus слухає
# на localhost:9090, Tempo — на localhost:3200 (всередині контейнера). uid prometheus — на нього
# посилається дашборд red.json.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://localhost:3200
    editable: false
