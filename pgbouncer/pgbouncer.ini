[databases]
; курсова база; пул тримає з'єднання до Postgres-сервісу `db`
marketplace = host=db port=5432 dbname=marketplace

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; SCRAM: плоский userlist.txt ("user" "password"), пароль збігається з паролем у Postgres
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; transaction mode: з'єднання до сервера повертається в пул ПІСЛЯ КОЖНОЇ транзакції,
; тож 100+ клієнтів мультиплексуються на кілька серверних з'єднань
pool_mode = transaction
default_pool_size = 5
max_client_conn = 100

; адмін-консоль (psql -d pgbouncer -c "SHOW POOLS")
admin_users = marketplace

; transaction mode ламає session-level named prepared statements — тримаємо їх кеш
; на боці PgBouncer (>=1.21), щоб TypeORM/міграції/pg жили через пул
max_prepared_statements = 200

; параметри старту, які клієнт шле, а pgbouncer не мусить розуміти
ignore_startup_parameters = extra_float_digits,options
