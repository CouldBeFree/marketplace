services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 10

  # Пулер з'єднань перед Postgres. Застосунок ходить у базу ЧЕРЕЗ нього
  # (DB_URL → pgbouncer), а не напряму. Конфіг — у репо (pgbouncer/*).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      # опублікований на хост — грейдер ходить із хоста, не з мережі compose
      - '${PGBOUNCER_PORT:-6432}:6432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U marketplace -d marketplace || exit 1']
      interval: 3s
      timeout: 3s
      retries: 15

  # Backing-store брокера контрактів (ізольований від курсової БД).
  pactbroker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pactbroker
      POSTGRES_PASSWORD: pactbroker
      POSTGRES_DB: pactbroker
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pactbroker']
      interval: 3s
      timeout: 3s
      retries: 15

  # Pact Broker: зберігає контракти, результати верифікації і відповідає can-i-deploy.
  pact-broker:
    image: pactfoundation/pact-broker:latest
    depends_on:
      pactbroker-db:
        condition: service_healthy
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pactbroker:pactbroker@pactbroker-db:5432/pactbroker
      PACT_BROKER_PORT: '9292'
    ports:
      - '${PACT_BROKER_PORT:-9292}:9292'
    healthcheck:
      # 127.0.0.1, НЕ localhost: puma всередині слухає лише IPv4
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9292/diagnostic/status/heartbeat || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30

  # Брокер подій (ДЗ #19). Асинхронні повідомлення order.placed: topic-exchange →
  # quorum-черга → споживач, з окремим контуром DLQ. Образ із суфіксом -management:
  # web-UI на :15672 (app/app) + rabbitmq-diagnostics для healthcheck.
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      # дев-креденшели локального брокера (не секрет). Грейдер очікує саме їх у BROKER_URL.
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
      # Erlang-cookie для розподіленого вузла. Явне значення — бо в деяких середовищах
      # авто-генерація дає порожній cookie ("Too short cookie string") і брокер не стартує.
      RABBITMQ_ERLANG_COOKIE: marketplace-rmq-cookie
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'      # AMQP — застосунок/демо
      - '${RABBITMQ_MGMT_PORT:-15672}:15672' # web-керування
    healthcheck:
      # офіційна перевірка «вузол живий» — щоб `docker compose up -d --wait` чекав
      # саме готовності брокера, а не лише старту контейнера.
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  # ── Redis під КЕШ (ДЗ #23). maxmemory + allkeys-lru: кеш мусить витісняти найменш
  # вживані ключі, коли впирається в ліміт пам'яті. Порт поза лекційним 22300-22399,
  # щоб наш стек і стек лекції не билися за порт. save "" — без RDB-снапшотів (кеш
  # не має переживати рестарт; це його і робить кешем, а не сховищем).
  redis-cache:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ''
    ports:
      - '${REDIS_CACHE_PORT:-6391}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 10

  # ── Redis під ЧЕРГУ + сесії + ліміт (ДЗ #23). maxmemory-policy noeviction: BullMQ
  # прямо вимагає — черга «cannot work properly if Redis evicts keys arbitrarily».
  # Сесії тут же (noeviction ніколи не викине ключ сесії, на відміну від allkeys-lru).
  # AOF everysec — довговічність задач/сесій між рестартами. Несумісність політик із
  # кеш-інстансом — саме тому це ОКРЕМИЙ контейнер (SELECT 1 maxmemory не розводить).
  redis-queue:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    ports:
      - '${REDIS_QUEUE_PORT:-6392}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
