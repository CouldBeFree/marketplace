services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 10

  # Пулер з'єднань перед Postgres. Застосунок ходить у базу ЧЕРЕЗ нього
  # (DB_URL → pgbouncer), а не напряму. Конфіг — у репо (pgbouncer/*).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      # опублікований на хост — грейдер ходить із хоста, не з мережі compose
      - '${PGBOUNCER_PORT:-6432}:6432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 6432 -U marketplace -d marketplace || exit 1']
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
